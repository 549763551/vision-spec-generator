<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>光学实验室 · 打光调试</title>
<style>
:root{
  --bg:#0b0d0c; --surface:#111413; --surface2:#181c1b; --line:#ffffff12; --line2:#ffffff21;
  --ink1:#f2f4f2; --ink2:#c8ceca; --ink3:#939d98; --accent:#2fd3c5; --accent-hi:#54e0d3;
  --accent-soft:#2fd3c51f; --warn:#e8a33d;
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-snappy:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink2); font-size:13px; line-height:1.6;
  font-family:"PingFang SC","苹方简体","PingFang TC",-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow:hidden;
}
button,input{font:inherit} button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

.app{display:flex; flex-direction:column; height:100vh}
.topbar{
  display:flex; align-items:center; gap:16px; padding:12px 20px;
  border-bottom:1px solid var(--line); background:rgba(11,13,12,.85); backdrop-filter:blur(12px);
}
.back{
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:8px;
  border:1px solid var(--line); color:var(--ink2); font-size:12px;
  transition:all 140ms var(--ease-snappy);
}
.back:hover{border-color:var(--line2); color:var(--ink1); background:var(--surface2)}
.brand{display:flex; align-items:center; gap:10px}
.brand-dot{width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent)}
.brand h1{font-size:15px; font-weight:500; color:var(--ink1); margin:0}
.top-meta{margin-left:auto; display:flex; align-items:center; gap:12px; font-size:12px; color:var(--ink3)}
.cur-light{
  display:inline-flex; align-items:center; gap:8px; padding:5px 12px; border-radius:999px;
  border:1px solid #2fd3c533; background:var(--accent-soft); color:var(--accent-hi); font-weight:500;
}

.workspace{flex:1; display:grid; grid-template-columns:300px minmax(0,1fr); min-height:0}
.sidebar{
  border-right:1px solid var(--line); background:var(--surface); overflow-y:auto; padding:20px 18px;
}
.side-section+.side-section{border-top:1px solid var(--line); padding-top:18px; margin-top:18px}
.overline{font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--ink3); margin-bottom:4px}
.sidebar h2{font-size:14px; font-weight:500; color:var(--ink1); margin:0 0 14px}

.light-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.light-card{
  display:flex; flex-direction:column; gap:2px; padding:10px 12px; border-radius:10px; text-align:left;
  border:1px solid var(--line); background:var(--surface2); color:var(--ink2);
  transition:all 140ms var(--ease-snappy);
}
.light-card strong{font-size:13px; font-weight:500; color:var(--ink1)}
.light-card span{font-size:10.5px; color:var(--ink3); font-family:Consolas,monospace}
.light-card:hover{border-color:var(--line2); background:#1c2120}
.light-card.active{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 1px #2fd3c533}
.light-card.active strong{color:var(--accent-hi)}
.light-card.active span{color:var(--accent)}

.control{margin-top:16px}
.control-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px}
.control-head label{font-size:12px; color:var(--ink2)}
.control-head output{font-size:13px; font-weight:500; color:var(--accent-hi); font-variant-numeric:tabular-nums}
.control-foot{display:flex; justify-content:space-between; font-size:10px; color:var(--ink3); margin-top:5px}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:999px;
  background:var(--surface2); outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:var(--accent);
  border:2px solid #0b0d0c; box-shadow:0 0 0 1px var(--accent); cursor:grab;
  transition:transform 120ms var(--ease-snappy);
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type=range]::-moz-range-thumb{width:15px; height:15px; border-radius:50%; background:var(--accent); border:2px solid #0b0d0c; cursor:grab}
input[type=range]:disabled{opacity:.35}

.check-row{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink2); padding:6px 0; cursor:pointer}
.check-row input{accent-color:var(--accent); width:14px; height:14px}

.note{font-size:11px; line-height:1.7; color:var(--ink3); border-left:2px solid var(--accent-soft); padding-left:10px; margin-top:14px}

.stage{position:relative; min-width:0; background:radial-gradient(ellipse at 60% -10%, #12202a 0%, transparent 55%), var(--bg)}
.stage canvas{display:block; width:100%; height:100%}
.scene-hud{position:absolute; left:18px; top:16px; display:flex; gap:8px; flex-wrap:wrap}
.token{
  font-size:11px; padding:4px 10px; border-radius:6px; background:rgba(17,20,19,.82);
  border:1px solid var(--line); color:var(--ink2); font-variant-numeric:tabular-nums;
}
.scene-help{position:absolute; right:16px; bottom:14px; font-size:11px; color:var(--ink3)}
.legend{position:absolute; left:18px; bottom:14px; display:flex; gap:14px; font-size:11px; color:var(--ink3)}
.legend i{display:inline-block; width:16px; height:2px; vertical-align:middle; margin-right:5px}

@media(max-width:900px){
  body{overflow:auto}
  .app{height:auto}
  .workspace{grid-template-columns:1fr}
  .sidebar{border-right:none; border-bottom:1px solid var(--line)}
  .stage{height:60vh}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="back" href="/studio" id="backBtn">← 返回工作台</a>
    <div class="brand"><span class="brand-dot"></span><h1>光学实验室 · 打光调试</h1></div>
    <div class="top-meta">
      <span class="cur-light" id="curLight">RS · 环形光</span>
      <span id="ver"></span>
    </div>
  </header>
  <div class="workspace">
    <aside class="sidebar">
      <section class="side-section">
        <div class="overline">01 / 换光源</div>
        <h2>光源形态</h2>
        <div class="light-grid" id="lightGrid"></div>
      </section>
      <section class="side-section">
        <div class="overline">02 / 调角度与距离</div>
        <h2>安装调试</h2>
        <div class="control">
          <div class="control-head"><label for="angle">发光角（相对水平）</label><output id="angleOut">30°</output></div>
          <input id="angle" type="range" min="0" max="90" step="5" value="30" />
          <div class="control-foot"><span>0° 掠射</span><span>90° 直下</span></div>
        </div>
        <div class="control">
          <div class="control-head"><label for="wd">工作距离 WD</label><output id="wdOut">100 mm</output></div>
          <input id="wd" type="range" min="20" max="220" step="5" value="100" />
          <div class="control-foot"><span>20 mm</span><span>220 mm</span></div>
        </div>
      </section>
      <section class="side-section">
        <div class="overline">03 / 视图</div>
        <h2>可视化</h2>
        <label class="check-row"><input id="showRays" type="checkbox" checked />显示入射光线</label>
        <label class="check-row"><input id="showSpec" type="checkbox" checked />显示镜面反射方向</label>
        <div class="note">
          角度与距离在 3D 里实时变化，不必回服务器。换光源形态才重新取几何。
          这是打光思路的直观推演，不是定量照度仿真。
        </div>
      </section>
    </aside>
    <main class="stage">
      <canvas id="scene"></canvas>
      <div class="scene-hud">
        <span class="token" id="tkSeries">RS</span>
        <span class="token" id="tkAngle">30°</span>
        <span class="token" id="tkWD">WD 100 mm</span>
      </div>
      <div class="legend">
        <span><i style="background:#2fd3c5"></i>入射光</span>
        <span><i style="background:#ffd99a"></i>镜面反射</span>
      </div>
      <div class="scene-help">拖动旋转 · 滚轮缩放 · 双击复位</div>
    </main>
  </div>
</div>

<script src="/vendor/three.min.js"></script>
<script>
const T = THREE;
const $ = id => document.getElementById(id);
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));

// ── 状态：从 URL 读推荐初始值 ──────────────────────────────
const qs = new URLSearchParams(location.search);
const state = {
  series: qs.get('series') || 'RS',
  angle: parseFloat(qs.get('angle')) || 30,   // 发光角（相对水平面）
  wd: parseFloat(qs.get('wd')) || 100,        // 工作距离 mm
  fov: qs.get('fov') || '15x12',
  showRays: true, showSpec: true,
};

// ── Three.js 基础 ─────────────────────────────────────────
const canvas = $('scene');
const renderer = new T.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new T.Scene();
scene.background = new T.Color(0x0b0d0c);
scene.fog = new T.FogExp2(0x0b0d0c, 0.02);
const camera = new T.PerspectiveCamera(45, 2, 0.1, 300);
const orbit = { az:-0.6, el:0.5, zoom:1 };

scene.add(new T.AmbientLight(0x404a46, 1.0));
const key = new T.DirectionalLight(0xfff6ec, 2.2); key.position.set(4,8,6); scene.add(key);
const rim = new T.DirectionalLight(0x6ff0e0, 0.8); rim.position.set(-5,3,-4); scene.add(rim);
const grid = new T.GridHelper(40, 40, 0x1d2a27, 0x121a17); grid.position.y = -0.02; scene.add(grid);

// 材质
function M(c, m=0.6, r=0.5){ return new T.MeshStandardMaterial({color:c, metalness:m, roughness:r}); }
const MAT = {
  body: M(0x2b2f31,0.72,0.42), dark: M(0x14171a,0.7,0.5),
  plate: M(0x383d41,0.85,0.3),
  work: M(0x3a4046,0.4,0.55),
  led: new T.MeshStandardMaterial({color:0xeafffb, emissive:0x2fd3c5, emissiveIntensity:1.4, roughness:0.3}),
  ray: new T.LineBasicMaterial({color:0x2fd3c5, transparent:true, opacity:0.5}),
  spec: new T.LineBasicMaterial({color:0xffd99a, transparent:true, opacity:0.6}),
};

// ── 工件（底部平板）────────────────────────────────────────
const workpiece = new T.Group();
{
  const board = new T.Mesh(new T.BoxGeometry(3.2, 0.08, 2.4), MAT.work);
  board.position.y = 0.04; workpiece.add(board);
  // 中央特征区（被照目标）
  const feat = new T.Mesh(new T.CylinderGeometry(0.5,0.5,0.06,40), M(0x6b5a3a,0.7,0.4));
  feat.position.y = 0.11; workpiece.add(feat);
  const ring = new T.Mesh(new T.TorusGeometry(0.62,0.02,10,48), MAT.plate);
  ring.rotation.x = Math.PI/2; ring.position.y = 0.1; workpiece.add(ring);
}
scene.add(workpiece);

// ── 相机（顶部固定）────────────────────────────────────────
const camRig = new T.Group();
{
  const body = new T.Mesh(new T.BoxGeometry(0.7,0.5,0.6), MAT.body);
  camRig.add(body);
  const lens = new T.Mesh(new T.CylinderGeometry(0.2,0.24,0.5,28), MAT.dark);
  lens.position.y = -0.48; camRig.add(lens);
  const glass = new T.Mesh(new T.CircleGeometry(0.18,28),
    new T.MeshStandardMaterial({color:0x0a2024, metalness:0.4, roughness:0.1}));
  glass.rotation.x = Math.PI/2; glass.position.y = -0.74; camRig.add(glass);
}
camRig.position.set(0, 4.6, 0);
scene.add(camRig);

// 相机轴（虚线）
const axisGeo = new T.BufferGeometry().setFromPoints([new T.Vector3(0,0.12,0), new T.Vector3(0,4.3,0)]);
const axis = new T.Line(axisGeo, new T.LineDashedMaterial({color:0x8ba0a0, dashSize:0.1, gapSize:0.08, transparent:true, opacity:0.4}));
axis.computeLineDistances(); scene.add(axis);

// ── 光源组（可换形态、可调角度/WD）─────────────────────────
let lightGroup = new T.Group();
scene.add(lightGroup);
let lightGeo = null;   // 后端返回的几何参数
let emitterPts = [];   // 发光点（用于画光线）

function clearGroup(g){ while(g.children.length){ const c=g.children.pop(); c.traverse(o=>{ if(o.geometry)o.geometry.dispose(); }); } }

function buildLightMesh(shape, geo){
  const g = new T.Group();
  const s = geo.scale || 1;
  emitterPts = [];
  if(shape === 'ring'){
    const r = geo.radius || 0.8;
    const housing = new T.Mesh(new T.TorusGeometry(r, 0.07, 14, 64), MAT.body);
    housing.rotation.x = Math.PI/2; g.add(housing);
    const diff = new T.Mesh(new T.TorusGeometry(r, 0.03, 10, 64), MAT.led);
    diff.rotation.x = Math.PI/2; g.add(diff);
    const n = geo.count || 24;
    const ledGeo = new T.SphereGeometry(0.03, 8, 8);
    for(let i=0;i<n;i++){
      const a = i/n*Math.PI*2;
      const led = new T.Mesh(ledGeo, MAT.led);
      led.position.set(r*Math.cos(a), 0, r*Math.sin(a)); g.add(led);
      if(i%3===0) emitterPts.push(new T.Vector3(r*Math.cos(a), 0, r*Math.sin(a)));
    }
  } else if(shape === 'bars'){
    const len = geo.length || 1.4;
    for(const side of [-1,1]){
      const bar = new T.Mesh(new T.BoxGeometry(len, 0.09, 0.16), MAT.body);
      bar.position.set(0, 0, side*0.7); g.add(bar);
      const face = new T.Mesh(new T.BoxGeometry(len*0.94, 0.03, 0.1), MAT.led);
      face.position.set(0, -0.06, side*0.7); g.add(face);
      for(let i=0;i<4;i++) emitterPts.push(new T.Vector3((i/3-0.5)*len*0.8, -0.06, side*0.7));
    }
  } else if(shape === 'panel'){
    const r = geo.radius || 0.9;
    const frame = new T.Mesh(new T.BoxGeometry(r*2.1, 0.08, r*2.1), MAT.dark);
    g.add(frame);
    const face = new T.Mesh(new T.PlaneGeometry(r*1.9, r*1.9), MAT.led);
    face.rotation.x = Math.PI/2; face.position.y = -0.05; g.add(face);
    for(let i=0;i<3;i++) for(let j=0;j<3;j++)
      emitterPts.push(new T.Vector3((i-1)*r*0.6, -0.05, (j-1)*r*0.6));
  } else if(shape === 'coax'){
    const r = geo.radius || 0.34;
    const box = new T.Mesh(new T.BoxGeometry(r*2, r*2, r*2), MAT.body);
    g.add(box);
    // 45° 半透半反镜
    const mirror = new T.Mesh(new T.PlaneGeometry(r*1.7, r*1.7),
      new T.MeshStandardMaterial({color:0x9fd8d0, metalness:0.9, roughness:0.1, transparent:true, opacity:0.5, side:T.DoubleSide}));
    mirror.rotation.set(Math.PI/2, 0, Math.PI/4); g.add(mirror);
    const src = new T.Mesh(new T.PlaneGeometry(r*1.4, r*1.4), MAT.led);
    src.position.x = -r; src.rotation.y = Math.PI/2; g.add(src);
    emitterPts.push(new T.Vector3(0, -r*0.4, 0));
  } else if(shape === 'dome'){
    const r = geo.radius || 0.7;
    const dome = new T.Mesh(new T.SphereGeometry(r, 32, 20, 0, Math.PI*2, 0, Math.PI/2),
      new T.MeshStandardMaterial({color:0xdff7f2, emissive:0x2fd3c5, emissiveIntensity:0.5, roughness:0.6, side:T.DoubleSide}));
    g.add(dome);
    const rim2 = new T.Mesh(new T.TorusGeometry(r, 0.04, 10, 48), MAT.body);
    rim2.rotation.x = Math.PI/2; g.add(rim2);
    for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; emitterPts.push(new T.Vector3(r*0.7*Math.cos(a), -0.05, r*0.7*Math.sin(a))); }
  } else if(shape === 'line'){
    const len = geo.length || 1.6;
    const bar = new T.Mesh(new T.BoxGeometry(len, 0.1, 0.14), MAT.body);
    g.add(bar);
    const face = new T.Mesh(new T.BoxGeometry(len*0.95, 0.03, 0.08), MAT.led);
    face.position.y = -0.06; g.add(face);
    for(let i=0;i<5;i++) emitterPts.push(new T.Vector3((i/4-0.5)*len*0.85, -0.06, 0));
  } else { // tunnel
    const r = geo.radius || 0.6;
    const tun = new T.Mesh(new T.CylinderGeometry(r, r, r*1.4, 32, 1, true, 0, Math.PI),
      new T.MeshStandardMaterial({color:0xdff7f2, emissive:0x2fd3c5, emissiveIntensity:0.5, roughness:0.6, side:T.DoubleSide}));
    tun.rotation.z = Math.PI/2; g.add(tun);
    for(let i=0;i<5;i++) emitterPts.push(new T.Vector3((i/4-0.5)*r, -0.05, 0));
  }
  return g;
}

// ── 光线（入射 + 镜面反射）─────────────────────────────────
const rayGroup = new T.Group(); scene.add(rayGroup);
function rebuildRays(){
  clearGroup(rayGroup);
  if(!emitterPts.length) return;
  const inc = [], spec = [];
  // 光源当前的世界变换（角度倾斜 + WD 高度）
  lightGroup.updateMatrixWorld(true);
  for(const p of emitterPts){
    const w = p.clone().applyMatrix4(lightGroup.matrixWorld);
    const target = new T.Vector3(0, 0.14, 0);
    inc.push(w.x, w.y, w.z, target.x, target.y, target.z);
    // 镜面反射：以工件法线(0,1,0)反射入射方向
    const d = target.clone().sub(w).normalize();
    const n = new T.Vector3(0,1,0);
    const refl = d.clone().sub(n.multiplyScalar(2*d.dot(n))).normalize();
    const end = target.clone().add(refl.multiplyScalar(1.6));
    spec.push(target.x, target.y, target.z, end.x, end.y, end.z);
  }
  if(state.showRays){
    const g1 = new T.BufferGeometry(); g1.setAttribute('position', new T.Float32BufferAttribute(inc,3));
    rayGroup.add(new T.LineSegments(g1, MAT.ray));
  }
  if(state.showSpec){
    const g2 = new T.BufferGeometry(); g2.setAttribute('position', new T.Float32BufferAttribute(spec,3));
    rayGroup.add(new T.LineSegments(g2, MAT.spec));
  }
}

// ── 应用状态：位置 / 朝向 / 光线 ────────────────────────────
function applyState(){
  // WD：毫米 → 场景单位（约 /40）
  lightGroup.position.set(0, 0.14 + state.wd/40, 0);
  // 发光角：90° 直打（光源水平），角度越小光源越倾斜（斜打）
  const tilt = (90 - state.angle) * Math.PI/180;
  lightGroup.rotation.set(tilt, 0, 0);
  // 更新 HUD
  $('tkSeries').textContent = state.series;
  $('tkAngle').textContent = state.angle + '°';
  $('tkWD').textContent = 'WD ' + state.wd + ' mm';
  $('angleOut').textContent = state.angle + '°';
  $('wdOut').textContent = state.wd + ' mm';
  $('angle').value = state.angle;
  $('wd').value = state.wd;
  rebuildRays();
}

// ── 换光源：回后端取几何 ────────────────────────────────────
async function loadLight(series){
  state.series = series;
  const r = await fetch(`/api/lab?series=${series}&fov=${state.fov}`);
  const d = await r.json();
  if(!d.ok) return;
  lightGeo = d.light;
  clearGroup(lightGroup);
  lightGroup.add(buildLightMesh(lightGeo.shape, lightGeo));
  $('curLight').textContent = `${d.series} · ${d.form}`;
  // 用该形态的默认角度
  if(d.default_angle || d.default_angle===0){
    state.angle = d.default_angle;
  }
  document.querySelectorAll('.light-card').forEach(c=>c.classList.toggle('active', c.dataset.series===series));
  applyState();
}

// ── 光源选择按钮 ──────────────────────────────────────────
async function initGrid(){
  const r = await fetch(`/api/lab?series=${state.series}&fov=${state.fov}`);
  const d = await r.json();
  const grid = $('lightGrid');
  grid.innerHTML = '';
  d.lights.forEach(l=>{
    const b = document.createElement('button');
    b.className = 'light-card' + (l.series===state.series?' active':'');
    b.dataset.series = l.series;
    b.innerHTML = `<strong>${l.form}</strong><span>${l.series}</span>`;
    b.onclick = ()=>loadLight(l.series);
    grid.appendChild(b);
  });
  // 初始光源
  lightGeo = d.light;
  clearGroup(lightGroup);
  lightGroup.add(buildLightMesh(lightGeo.shape, lightGeo));
  $('curLight').textContent = `${d.series} · ${d.form}`;
  if(qs.get('angle')===null && (d.default_angle||d.default_angle===0)) state.angle = d.default_angle;
  applyState();
}

// ── 控件绑定 ──────────────────────────────────────────────
$('angle').addEventListener('input', e=>{ state.angle = +e.target.value; applyState(); });
$('wd').addEventListener('input', e=>{ state.wd = +e.target.value; applyState(); });
$('showRays').addEventListener('change', e=>{ state.showRays = e.target.checked; rebuildRays(); });
$('showSpec').addEventListener('change', e=>{ state.showSpec = e.target.checked; rebuildRays(); });
$('backBtn').addEventListener('click', e=>{
  if(document.referrer && new URL(document.referrer).origin===location.origin){ e.preventDefault(); history.back(); }
});

// ── 轨道控制（拖拽旋转 / 滚轮缩放）─────────────────────────
let drag = null;
canvas.addEventListener('pointerdown', e=>{ drag={x:e.clientX,y:e.clientY,az:orbit.az,el:orbit.el}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e=>{ if(!drag)return; orbit.az=drag.az+(e.clientX-drag.x)*0.008; orbit.el=clamp(drag.el-(e.clientY-drag.y)*0.008,0.05,1.5); });
canvas.addEventListener('pointerup', ()=>drag=null);
canvas.addEventListener('pointercancel', ()=>drag=null);
canvas.addEventListener('dblclick', ()=>{ orbit.az=-0.6; orbit.el=0.5; orbit.zoom=1; });
canvas.addEventListener('wheel', e=>{ e.preventDefault(); orbit.zoom=clamp(orbit.zoom*Math.exp(e.deltaY*0.001),0.5,2.2); },{passive:false});

// ── 渲染循环 ──────────────────────────────────────────────
function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if(canvas.width!==w||canvas.height!==h){ renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
}
function frame(){
  resize();
  const dist = 11.5*orbit.zoom;
  const t = new T.Vector3(0, 1.7, 0);
  camera.position.set(
    t.x + dist*Math.cos(orbit.el)*Math.sin(orbit.az),
    t.y + dist*Math.sin(orbit.el),
    t.z + dist*Math.cos(orbit.el)*Math.cos(orbit.az)
  );
  camera.lookAt(t);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

fetch('/api/version').then(r=>r.json()).then(d=>$('ver').textContent=d.version||'').catch(()=>{});
initGrid();
frame();
</script>
</body>
